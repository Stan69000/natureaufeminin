name: Deploy to O2Switch

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - sanity_content_updated
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # Le site public est servi depuis la racine FTP. Le dossier /naturaufeminin.fr/
  # visé jusqu'ici par la cible « production » contient une copie figée en mai
  # 2026 : ce n'est pas une cible de déploiement, c'est un reliquat à supprimer.
  SERVER_DIR: /
  # Environnement GitHub sans règle d'approbation. « production » en a une
  # (required_reviewers), ce qui mettait en attente toute publication déclenchée
  # depuis l'admin — aucune n'est jamais partie.
  DEPLOY_ENVIRONMENT: parallel

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    outputs:
      deploy_trigger: ${{ steps.meta.outputs.deploy_trigger }}
      deploy_env_name: ${{ steps.meta.outputs.deploy_env_name }}
      deploy_env_url: ${{ steps.meta.outputs.deploy_env_url }}
      server_dir: ${{ steps.meta.outputs.server_dir }}

    steps:
      - name: Resolve deployment target
        id: meta
        run: |
          # Une seule cible réelle : la racine du site. Les trois déclencheurs
          # — push sur main, publication depuis l'admin (repository_dispatch),
          # lancement manuel — y mènent désormais tous.
          case "${{ github.event_name }}" in
            repository_dispatch) echo "deploy_trigger=admin" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch)   echo "deploy_trigger=manuel" >> "$GITHUB_OUTPUT" ;;
            *)                   echo "deploy_trigger=push" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "deploy_env_name=${{ env.DEPLOY_ENVIRONMENT }}" >> "$GITHUB_OUTPUT"
          echo "deploy_env_url=https://naturaufeminin.fr" >> "$GITHUB_OUTPUT"
          echo "server_dir=${{ env.SERVER_DIR }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.PUBLIC_CONTACT_FORM_ENDPOINT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          NAF_ADMIN_API_URL: ${{ secrets.NAF_ADMIN_API_URL }}

      - name: Write trusted proxy IPs config
        run: |
          if [ -n "${TRUSTED_PROXY_IPS:-}" ]; then
            printf "%s" "$TRUSTED_PROXY_IPS" > dist/.trusted_proxy_ips
          fi
        env:
          TRUSTED_PROXY_IPS: ${{ secrets.TRUSTED_PROXY_IPS }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          # .htaccess est un fichier cache : sans ce flag, upload-artifact (>= v4)
          # le retire silencieusement de l'artefact et il n'atteint jamais la prod.
          include-hidden-files: true

  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ needs.build.outputs.deploy_env_name }}
      url: ${{ needs.build.outputs.deploy_env_url }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Deploy target summary
        run: |
          echo "Déclencheur : ${{ needs.build.outputs.deploy_trigger }}"
          echo "Server directory: ${{ needs.build.outputs.server_dir }}"

      - name: Deploy to O2Switch
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./dist/
          server-dir: ${{ needs.build.outputs.server_dir }}
          dangerous-clean-slate: false
