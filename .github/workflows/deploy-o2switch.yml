name: Deploy to O2Switch

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - sanity_content_updated
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: parallel
        type: choice
        options:
          - parallel
          - production

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PRODUCTION_SERVER_DIR: /naturaufeminin.fr/
  PARALLEL_SERVER_DIR: /

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    outputs:
      deploy_target: ${{ steps.meta.outputs.deploy_target }}
      deploy_env_name: ${{ steps.meta.outputs.deploy_env_name }}
      deploy_env_url: ${{ steps.meta.outputs.deploy_env_url }}
      server_dir: ${{ steps.meta.outputs.server_dir }}

    steps:
      - name: Resolve deployment target
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.action }}" = "sanity_content_updated" ]; then
            echo "deploy_target=production" >> "$GITHUB_OUTPUT"
            echo "deploy_env_name=production" >> "$GITHUB_OUTPUT"
            echo "deploy_env_url=https://naturaufeminin.fr" >> "$GITHUB_OUTPUT"
            echo "server_dir=${{ env.PRODUCTION_SERVER_DIR }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.target }}" = "production" ]; then
            echo "deploy_target=production" >> "$GITHUB_OUTPUT"
            echo "deploy_env_name=production" >> "$GITHUB_OUTPUT"
            echo "deploy_env_url=https://naturaufeminin.fr" >> "$GITHUB_OUTPUT"
            echo "server_dir=${{ env.PRODUCTION_SERVER_DIR }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_target=parallel" >> "$GITHUB_OUTPUT"
            echo "deploy_env_name=parallel" >> "$GITHUB_OUTPUT"
            echo "deploy_env_url=https://naturaufeminin.fr" >> "$GITHUB_OUTPUT"
            echo "server_dir=${{ env.PARALLEL_SERVER_DIR }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.PUBLIC_CONTACT_FORM_ENDPOINT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          NAF_ADMIN_API_URL: ${{ secrets.NAF_ADMIN_API_URL }}

      - name: Write trusted proxy IPs config
        run: |
          if [ -n "${TRUSTED_PROXY_IPS:-}" ]; then
            printf "%s" "$TRUSTED_PROXY_IPS" > dist/.trusted_proxy_ips
          fi
        env:
          TRUSTED_PROXY_IPS: ${{ secrets.TRUSTED_PROXY_IPS }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ needs.build.outputs.deploy_env_name }}
      url: ${{ needs.build.outputs.deploy_env_url }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist

      - name: Deploy target summary
        run: |
          echo "Target: ${{ needs.build.outputs.deploy_target }}"
          echo "Server directory: ${{ needs.build.outputs.server_dir }}"

      - name: Deploy to O2Switch
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./dist/
          server-dir: ${{ needs.build.outputs.server_dir }}
          dangerous-clean-slate: false
